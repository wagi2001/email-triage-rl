<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #f6f8fa; color: #24292e; }

    #rule-banner {
      background: #0366d6; color: white;
      padding: 10px 20px; font-size: 14px;
      border-bottom: 1px solid #0256c7;
    }
    #rule-banner span { font-weight: 600; }

    #inbox { max-width: 800px; margin: 20px auto; }

    .email-row {
      display: flex; align-items: center; gap: 12px;
      background: white; border: 1px solid #e1e4e8;
      border-radius: 6px; padding: 12px 16px;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .email-row.unopened { background: #fafbfc; }
    .email-row.actioned { opacity: 0.4; }
    .email-row.deleted  { background: #ffeef0; border-color: #f97583; }
    .email-row.archived { background: #f1f8ff; border-color: #79b8ff; }
    .email-row.labelled { background: #fffbdd; border-color: #ffea7f; }

    .email-meta { flex: 1; }
    .sender-name  { font-weight: 600; font-size: 14px; }
    .sender-email { font-size: 12px; color: #586069; }
    .sender-hidden { font-size: 13px; color: #959da5; font-style: italic; }
    .subject      { font-size: 13px; color: #444d56; margin-top: 3px; }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 5px 10px; font-size: 12px; border-radius: 4px;
      border: 1px solid #d1d5da; cursor: pointer; background: white;
      font-weight: 500;
    }
    .btn:hover { background: #f3f4f6; }
    .btn.open    { border-color: #959da5; color: #444d56; }
    .btn.delete  { border-color: #f97583; color: #d73a49; }
    .btn.archive { border-color: #79b8ff; color: #0366d6; }
    .btn.label   { border-color: #ffea7f; color: #735c0f; }
    .btn.skip    { border-color: #d1d5da; color: #586069; }

    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 11px; font-weight: 600; margin-top: 4px;
    }
    .tag.newsletter { background: #fffbdd; color: #735c0f; border: 1px solid #ffea7f; }
  </style>
</head>
<body>
  <div id="rule-banner">Rule: <span id="rule-text">No rule loaded</span></div>
  <div id="inbox"></div>

<script>
  let emails = [];
  let actions = {};
  let opened = {};
  let partialObs = false;

  function loadInbox(emailList, ruleText, partialObsFlag) {
    emails = emailList;
    actions = {};
    opened = {};
    partialObs = !!partialObsFlag;
    document.getElementById("rule-text").textContent = ruleText;
    render();
  }

  function senderBlock(email) {
    const isOpen = opened[email.id] || !partialObs;
    if (isOpen) {
      return `<div class="sender-name">${email.sender_name}
        <span class="sender-email">&lt;${email.sender_email}&gt;</span></div>`;
    }
    return `<div class="sender-hidden">Sender hidden — click Open</div>`;
  }

  function render() {
    const container = document.getElementById("inbox");
    container.innerHTML = "";

    emails.forEach(email => {
      const action = actions[email.id];
      const isOpen = opened[email.id] || !partialObs;
      let rowClass = "email-row";
      if (!isOpen && partialObs) rowClass += " unopened";
      if (action) {
        rowClass += " actioned " + (
          action === "delete" ? "deleted" :
          action === "archive" ? "archived" :
          action.startsWith("label") ? "labelled" : ""
        );
      }

      const row = document.createElement("div");
      row.className = rowClass;
      row.setAttribute("data-id", email.id);
      if (action) row.setAttribute("data-action", action);
      if (isOpen) row.setAttribute("data-opened", "true");

      const openBtn = partialObs && !isOpen
        ? `<button class="btn open" onclick="openEmail(${email.id})">Open</button>`
        : "";

      row.innerHTML = `
        <div class="email-meta">
          ${senderBlock(email)}
          <div class="subject">${email.subject}</div>
          ${action && action.startsWith("label:") ?
            `<span class="tag newsletter">${action.split(":")[1]}</span>` : ""}
        </div>
        <div class="actions">
          ${openBtn}
          <button class="btn delete"  onclick="act(${email.id}, 'delete')">Delete</button>
          <button class="btn archive" onclick="act(${email.id}, 'archive')">Archive</button>
          <button class="btn label"   onclick="act(${email.id}, 'label:newsletter')">Label</button>
          <button class="btn skip"    onclick="act(${email.id}, 'skip')">Skip</button>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function openEmail(emailId) {
    opened[emailId] = true;
    render();
  }

  function act(emailId, action) {
    actions[emailId] = action;
    render();
  }

  function getState() {
    return { emails, actions, opened };
  }
</script>
</body>
</html>
