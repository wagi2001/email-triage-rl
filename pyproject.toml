[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-rl"
version = "0.2.0"
description = "Gymnasium email triage environment for LLM evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "playwright>=1.40",
    "ollama>=0.3",
    "openai>=1.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
email-triage = "run:main"

[tool.setuptools]
py-modules = [
    "agent",
    "config",
    "email_data",
    "env",
    "llm_agent",
    "logging_config",
    "run",
    "trajectory_logger",
    "verifier",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*"]
